name: Build Feed Catalog

"on":
  push:
    paths:
      - '*.opml.xml'
      - 'scripts/build_catalog.py'
  workflow_dispatch:

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build catalog
        run: python scripts/build_catalog.py

      - name: Check if catalog changed
        id: check
        run: |
          if git diff --quiet vox-feeds-catalog.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push catalog
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vox-feeds-catalog.json
          git commit -m "Update feed catalog [skip ci]"
          git push
